# Netlify settings for greatfoldgroup.com
[build]
  publish = "."

# Send www and the netlify.app address to the main domain
[[redirects]]
  from = "https://www.greatfoldgroup.com/*"
  to = "https://greatfoldgroup.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
